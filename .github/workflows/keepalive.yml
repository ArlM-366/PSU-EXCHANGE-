# Keeps the FREE Supabase project from auto-pausing (it pauses after 7 days without activity).
# Runs a real database query twice a week. Add two repository secrets first:
#   SUPABASE_URL        e.g. https://abcdxyz.supabase.co     (public)
#   SUPABASE_ANON_KEY   the project's "anon" key             (public by design)
# NEVER add the service_role key or the database password here.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 3 * * 1,4'     # Monday and Thursday, 03:17 UTC (GitHub may run it a little late)
  workflow_dispatch: {}         # lets you run it by hand from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /tmp/out -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/categories?select=name&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"; cat /tmp/out; echo
          test "$code" = "200"
